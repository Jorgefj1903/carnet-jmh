<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comercios con descuento · Carnet JMH</title>
<meta name="theme-color" content="#ff924f">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root{ --naranja:#ff924f; --naranja-prof:#b9531a; --verde-osc:#0c4a2a; --tinta:#2a1f16; }
  *{box-sizing:border-box;margin:0}
  body{
    font-family:"Josefin Sans",system-ui,sans-serif;color:var(--tinta);
    background-color:#c8202f;
    background-image:repeating-linear-gradient(45deg,rgba(15,15,15,.62) 0 15px,transparent 15px 30px),repeating-linear-gradient(-45deg,rgba(15,15,15,.62) 0 15px,transparent 15px 30px);
    background-attachment:fixed;
    padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));
    display:flex;justify-content:center;min-height:100vh;
  }
  .envoltorio{width:100%;max-width:440px}
  .panel{background:#fff;border-radius:20px;box-shadow:0 10px 24px rgba(0,0,0,.4);border:4px solid var(--naranja);overflow:hidden}
  .cab{background:var(--naranja);display:flex;align-items:center;gap:12px;padding:10px 14px;color:var(--verde-osc)}
  .cab img{width:56px;height:56px;background:#fff;border-radius:50%;padding:3px}
  .cab h1{font-family:"Permanent Marker",cursive;font-weight:400;font-size:19px;line-height:1.2;text-transform:uppercase}
  .cuerpo{padding:16px 16px 6px}
  .intro{font-size:15px;line-height:1.4;color:#5c4e3d;margin-bottom:14px;text-align:center}
  .comercio{border:2px solid var(--naranja);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:#fffaf5}
  .comercio h2{font-family:"Permanent Marker",cursive;font-weight:400;font-size:21px;line-height:1.2;color:var(--verde-osc)}
  .comercio .ofrece{font-size:15px;margin-top:3px}
  .descuento{display:inline-block;margin-top:8px;background:#fff1e4;border:1.5px solid var(--naranja);color:var(--verde-osc);font-weight:700;font-size:15px;padding:4px 14px;border-radius:999px}
  .contacto{font-size:14px;color:#5c4e3d;margin-top:8px;word-break:break-word}
  .contacto a{color:var(--naranja-prof);font-weight:700}
  .pie{background:var(--naranja);text-align:center;padding:12px}
  .volver{display:inline-block;color:var(--verde-osc);font-weight:700;font-size:16px;text-decoration:none}
  .msg{text-align:center;padding:24px 12px;font-size:16px;line-height:1.4}
</style>
</head>
<body>
<div class="envoltorio"><div class="panel">
  <div class="cab"><img src="logo.png" alt=""><h1>Comercios con descuento</h1></div>
  <div class="cuerpo" id="lista"><p class="msg">Cargando…</p></div>
  <div class="pie"><a class="volver" id="volver" href="./">← Volver a mi carnet</a></div>
</div></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbygqNvyAZhd2ux8o__NbCyV1d2k9kJ8WoAbU4vyn4dUU82KK3fY7eK7n-GP6CFT8Mfw9A/exec';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function leer(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function guardar(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
const token = new URLSearchParams(location.search).get('t') || leer('jmh_t');
const $l = document.getElementById('lista');
if (token) document.getElementById('volver').href = './?t=' + encodeURIComponent(token);

function enlace(c){
  const t = String(c).trim();
  if (/^https?:\/\//i.test(t)) return '<a href="' + esc(t) + '" target="_blank" rel="noopener">' + esc(t.replace(/^https?:\/\//i, '')) + '</a>';
  if (/^[\d\s+()-]{9,}$/.test(t)) return '<a href="tel:' + esc(t.replace(/[^\d+]/g, '')) + '">' + esc(t) + '</a>';
  return esc(t);
}
function pintar(lista){
  if (!lista.length) { $l.innerHTML = '<p class="msg">Todavía no hay comercios en la lista.</p>'; return; }
  $l.innerHTML = '<p class="intro">Enseña tu carnet en estos comercios. Los descuentos se irán confirmando.</p>' +
    lista.map(c =>
      '<div class="comercio"><h2>' + esc(c.nombre) + '</h2>' +
      (c.ofrece ? '<div class="ofrece">' + esc(c.ofrece) + '</div>' : '') +
      '<span class="descuento">' + esc(c.descuento || 'Descuento por confirmar') + '</span>' +
      (c.contacto ? '<div class="contacto">' + enlace(c.contacto) + '</div>' : '') + '</div>').join('');
}
(async function(){
  const g = leer('jmh_comercios');
  if (g) { try { pintar(JSON.parse(g)); } catch(e){} }
  if (!token) { $l.innerHTML = '<p class="msg">Abre esta página desde tu carnet.</p>'; return; }
  try {
    const r = await fetch(API + '?action=comercios&t=' + encodeURIComponent(token), { redirect: 'follow' });
    const d = await r.json();
    if (d && d.ok && d.activo) { guardar('jmh_comercios', JSON.stringify(d.comercios)); pintar(d.comercios); }
    else $l.innerHTML = '<p class="msg">Esta lista es solo para socios con el carnet activo.</p>';
  } catch(e){
    if (!g) $l.innerHTML = '<p class="msg">No se ha podido cargar la lista. Prueba de nuevo con cobertura.</p>';
  }
})();
</script>
</body>
</html>
